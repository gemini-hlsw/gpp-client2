# Read the Docs configuration for the gqlforge subproject.
#
# This file is selected by setting "Build configuration file" to
# gqlforge/.readthedocs.yaml in the gqlforge RTD project's settings
# (Admin -> Settings). Per RTD's monorepo rules, every path below is
# relative to the REPOSITORY root, not to this file's directory.

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

python:
  install:
    - method: pip
      path: gqlforge
      extra_requirements:
        - docs

sphinx:
  configuration: gqlforge/docs/source/conf.py
  fail_on_warning: true
