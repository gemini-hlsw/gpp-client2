[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gqlforge"
version = "0.0.0" # bumped by release-please; never edit by hand
description = "Multi-schema GraphQL-to-Python codegen: one operations tree, pruned per environment, emitting pydantic models and identical sync/async clients."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "graphql-core>=3.2",
    "httpx>=0.27",
    "typer>=0.12",
]
keywords = ["graphql", "codegen", "pydantic", "multi-schema", "client"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Code Generators",
]

[project.optional-dependencies]
docs = [
    "furo>=2024.8",
    "myst-parser>=4",
    "sphinx>=8",
    "sphinx-copybutton>=0.5",
    "sphinxcontrib-typer>=0.9.1",
]

[project.urls]
Homepage = "https://github.com/gemini-hlsw/gpp-client2/tree/main/gqlforge"
Source = "https://github.com/gemini-hlsw/gpp-client2"
Documentation = "https://gqlforge.readthedocs.io"
Issues = "https://github.com/gemini-hlsw/gpp-client2/issues"

[project.scripts]
gqlforge = "gqlforge.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gqlforge"]

[tool.hatch.build.targets.sdist]
include = ["src/gqlforge", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-r a -m 'not upstream'"
markers = [
    "upstream: fetches live public schemas over the network (run explicitly)",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]
