[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gqlforge"
version = "0.1.0"
description = "Multi-schema GraphQL-to-Python codegen: one operations tree, pruned per environment, emitting pydantic models and identical sync/async clients."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "graphql-core>=3.2",
    "httpx>=0.27",
]
keywords = ["graphql", "codegen", "pydantic", "multi-schema", "client"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Code Generators",
]

[project.optional-dependencies]
docs = [
    "furo>=2024.8",
    "myst-parser>=4",
    "sphinx>=8",
    "sphinx-argparse>=0.5",
    "sphinx-copybutton>=0.5",
]

[project.urls]
Homepage = "https://github.com/gemini-hlsw/gpp-client2/tree/main/gqlforge"
Source = "https://github.com/gemini-hlsw/gpp-client2"
Documentation = "https://gqlforge.readthedocs.io"
Issues = "https://github.com/gemini-hlsw/gpp-client2/issues"

[project.scripts]
gqlforge = "gqlforge.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gqlforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-r a -m 'not upstream'"
markers = [
    "upstream: fetches live public schemas over the network (run explicitly)",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "towncrier>=25.8.0",
]

# CHANGELOG.md is assembled by towncrier from fragments in changelog.d/ -
# never edit it by hand. Fragment types mirror Conventional Commits types.
[tool.towncrier]
name = "gqlforge"
package = "gqlforge"
package_dir = "src"
directory = "changelog.d"
filename = "CHANGELOG.md"
title_format = "## {version} ({project_date})"
underlines = ["", "", ""]

[[tool.towncrier.type]]
directory = "feat"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "fix"
name = "Fixed"
showcontent = true

[[tool.towncrier.type]]
directory = "perf"
name = "Performance"
showcontent = true

[[tool.towncrier.type]]
directory = "docs"
name = "Documentation"
showcontent = true

[[tool.towncrier.type]]
directory = "removal"
name = "Removed"
showcontent = true

[[tool.towncrier.type]]
directory = "misc"
name = "Misc"
showcontent = true
