# Read the Docs configuration for the gpp-client2 project. Selected by
# setting "Build configuration file" to gpp-client2/.readthedocs.yaml in
# the RTD project settings; per RTD's monorepo rules, every path below
# is relative to the REPOSITORY root.

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

python:
  install:
    - method: pip
      path: gpp-client2
      extra_requirements:
        - docs

sphinx:
  configuration: gpp-client2/docs/source/conf.py
  fail_on_warning: true
