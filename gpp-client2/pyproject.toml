[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gpp-client2"
version = "0.0.0" # bumped by release-please; never edit by hand
description = "Gemini Program Platform client."
readme = "README.md"
authors = [{ name = "NOIRLab" }]
license = { file = "LICENSE" }
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "graphql-core>=3.2",
    "httpx>=0.27",
    "pydantic>=2.7",
    "typer>=0.12",
    "websockets>=13",
]
keywords = ["gemini", "gpp", "client", "program", "platform"]

[project.scripts]
gpp2 = "gpp_client2.cli:main"

[project.urls]
Homepage = "https://github.com/gemini-hlsw/gpp-client2"
Source = "https://github.com/gemini-hlsw/gpp-client2"
Documentation = "https://gpp-client2.readthedocs.io"
Issues = "https://github.com/gemini-hlsw/gpp-client2/issues"

[project.optional-dependencies]
docs = [
    "furo>=2024.8",
    "myst-parser>=4",
    "sphinx>=8",
    "sphinx-copybutton>=0.5",
    "sphinxcontrib-typer>=0.9.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gpp_client2"]

[tool.hatch.build.targets.sdist]
include = ["src/gpp_client2", "README.md", "LICENSE", "pyproject.toml"]

[dependency-groups]
dev = [
    "gqlforge",
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[tool.uv.sources]
gqlforge = { workspace = true }

# How gqlforge produces src/gpp_client2/_generated from graphql/ - see
# gqlforge/README.md for the pipeline and this table's meaning.
[tool.gqlforge]
schemas = "graphql/schemas"
operations = "graphql/operations"
output = "src/gpp_client2/_generated"
merged_schema = "graphql/schemas/merged.graphql"
availability = "graphql/availability.json"
source_order = ["development", "staging", "production"]
generated_package = "gpp_client2._generated"
# No runtime_package: gqlforge vendors its runtime into _generated/ and
# emits the default client that GPPClient/AsyncGPPClient subclass.
domains_dir = "src/gpp_client2/domains"
environments = "gpp_client2.environments:ENVIRONMENTS"
download_token = "gpp_client2.config:find_download_token"
token_env = "GPP_TOKEN"

# Strict typing applies to the shipped package. The codegen package is a
# dev-only tool manipulating graphql-core AST nodes whose stubs fight every
# walk function; its correctness is enforced by its own validation steps
# (pruned documents must re-validate) and a dedicated unit-test suite.
# Generated modules carry `# mypy: ignore-errors` and are exercised by tests.
[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/gpp_client2"]

[[tool.mypy.overrides]]
module = "gpp_client2._generated.*"
strict = false
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-r a -m 'not live'"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
pythonpath = ["."]
markers = [
    "live: tests that hit a real GPP deployment (need a token; run explicitly)",
]
