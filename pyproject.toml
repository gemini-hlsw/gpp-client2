# Virtual workspace root - not a package. The projects live in the
# member directories; run project commands from inside them (uv finds
# the shared lock and venv from any member).
[tool.uv.workspace]
members = ["gpp-client2", "gqlforge"]

# Shared lint/format config for every member; per-project tools
# (pytest, mypy, gqlforge) live in each member's pyproject.
[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["gpp-client2/src/gpp_client2/_generated"]
# First-party detection: each member's import roots.
src = ["gpp-client2/src", "gpp-client2", "gqlforge/src", "gqlforge"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
