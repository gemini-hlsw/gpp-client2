name: Live tests

# Thorough nightly exercise of the real deployments: read-only smoke tests
# against development AND production, plus write round-trips against
# development (hard budget: 2 items per domain, 50 total; every created ID
# is ledger-tracked and only recorded IDs are deleted). Write round-trips
# against production never run on the schedule - manual dispatch only.
#
# Each environment has its own token secret (GPP_DEV_TOKEN, GPP_PROD_TOKEN).
# A leg whose secret is not configured is reported and skipped rather than
# failed, so a missing development token cannot mask a production regression.

on:
  schedule:
    - cron: "30 9 * * *"  # 09:30 UTC daily, after schema sync
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        type: choice
        options: [production, development]
        default: production
      write:
        description: "Also run write round-trips (create/update/delete)"
        type: boolean
        default: false

jobs:
  live:
    name: live (${{ matrix.environment }})
    runs-on: ubuntu-latest
    # Scheduled runs need the LIVE_TESTS_ENABLED repo variable. The Gate
    # step below narrows a manual dispatch to the chosen environment's leg
    # (the matrix context is not available in a job-level if).
    if: >-
      ${{ github.event_name == 'workflow_dispatch'
          || vars.LIVE_TESTS_ENABLED == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: development
            token_secret: GPP_DEV_TOKEN
          - environment: production
            token_secret: GPP_PROD_TOKEN
    env:
      GPP_ENVIRONMENT: ${{ matrix.environment }}
      GPP_TOKEN: ${{ secrets[matrix.token_secret] }}
    steps:
      - name: Gate
        id: gate
        run: |
          run=true
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
             && [ "${{ inputs.environment }}" != "${{ matrix.environment }}" ]; then
            run=false  # dispatched for the other environment
          elif [ -z "$GPP_TOKEN" ]; then
            run=false
            echo "::warning::No ${{ matrix.token_secret }} secret configured; ${{ matrix.environment }} was NOT tested."
            echo ":warning: No \`${{ matrix.token_secret }}\` secret - **${{ matrix.environment }} was not tested**." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: ${{ steps.gate.outputs.run == 'true' }}

      - name: Install uv
        if: ${{ steps.gate.outputs.run == 'true' }}
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: uv sync --all-packages

      - name: Read-only smoke tests
        if: ${{ steps.gate.outputs.run == 'true' }}
        working-directory: gpp-client2
        run: uv run pytest tests/test_live.py -m live -v

      - name: Write round-trips
        # Nightly on development; anywhere else only by explicit dispatch.
        if: >-
          ${{ steps.gate.outputs.run == 'true'
              && ((github.event_name == 'schedule' && matrix.environment == 'development')
                  || (github.event_name == 'workflow_dispatch' && inputs.write)) }}
        env:
          GPP_LIVE_WRITE: "1"
        working-directory: gpp-client2
        run: uv run pytest tests/test_live_roundtrip.py -m live -v

      # CI workspaces are ephemeral, so the suite's crashed-run self-healing
      # (re-reading the ledger on the next start) cannot happen here. A
      # non-empty ledger after a failure lists exactly the items that were
      # created and not deleted - preserve it for manual cleanup.
      - name: Preserve live-test ledger
        if: ${{ failure() && hashFiles('gpp-client2/.live-test-ledger.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: live-test-ledger-${{ matrix.environment }}-${{ github.run_id }}
          path: gpp-client2/.live-test-ledger.json
