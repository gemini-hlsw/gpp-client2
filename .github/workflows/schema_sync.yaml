name: Schema sync

# Nightly: download each environment's schema with its own token, regenerate,
# run the offline suite against the result, and open a PR if anything moved.
# That PR IS the promotion workflow - its diff shows the availability
# manifest changing, and merging it is the whole ceremony.

on:
  schedule:
    - cron: "0 9 * * *"  # 09:00 UTC daily
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Download schemas
        working-directory: gpp-client2
        env:
          GPP_DEV_TOKEN: ${{ secrets.GPP_DEV_TOKEN }}
          GPP_PROD_TOKEN: ${{ secrets.GPP_PROD_TOKEN }}
        run: |
          status=0
          download() {
            local env_name="$1" token="$2" secret="$3"
            if [ -z "$token" ]; then
              echo "::warning::No $secret secret configured; the committed $env_name schema was NOT refreshed."
              echo ":warning: No \`$secret\` secret - the **$env_name** schema was not refreshed." >> "$GITHUB_STEP_SUMMARY"
              return
            fi
            GPP_TOKEN="$token" uv run gqlforge download "$env_name" || status=1
          }
          download development "$GPP_DEV_TOKEN" GPP_DEV_TOKEN
          download production "$GPP_PROD_TOKEN" GPP_PROD_TOKEN
          exit "$status"

      - name: Regenerate
        working-directory: gpp-client2
        run: uv run gqlforge generate

      - name: Readiness report
        id: readiness
        working-directory: gpp-client2
        run: |
          {
            echo 'report<<EOF'
            uv run gqlforge readiness || true
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Tests
        working-directory: gpp-client2
        run: uv run pytest

      - name: Open or update PR
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.SCHEMA_SYNC_TOKEN || github.token }}
          branch: bot/schema-sync
          # feat so the availability change lands in release-please's
          # changelog (availability changes are user-visible).
          commit-message: "feat(schemas): sync environment schemas and availability"
          title: "Schema sync"
          body: |
            Nightly schema refresh. Review `gpp-client2/graphql/availability.json` for
            what moved between environments.

            ```
            ${{ steps.readiness.outputs.report }}
            ```
