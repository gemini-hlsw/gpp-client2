name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-packages --all-extras

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        working-directory: gpp-client2
        run: uv run mypy

      - name: Generated artifacts are current
        working-directory: gpp-client2
        run: uv run gqlforge check

      - name: gpp-client2 tests
        working-directory: gpp-client2
        run: uv run pytest

      - name: gqlforge tests
        working-directory: gqlforge
        run: uv run pytest

      - name: Docs build (both Sphinx trees, warnings are errors)
        run: |
          uv run sphinx-build -W -q -j auto gpp-client2/docs/source gpp-client2/docs/_build
          uv run sphinx-build -W -q -j auto gqlforge/docs/source gqlforge/docs/_build
